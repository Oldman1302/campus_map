<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Map Nodes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h1>Campus Graph Nodes</h1>

<ol id="nodesList">
    <li>Loading...</li>
</ol>

<script>
    async function loadNodes() {
        try {
            const response = await fetch("https://encyclopedic-nova-nontheological.ngrok-free.dev/", {
                headers: {
                    "ngrok-skip-browser-warning": "true"
                }
            });

            if (!response.ok) {
                throw new Error("Failed to fetch nodes");
            }

            const nodes = await response.json();

            const list = document.getElementById("nodesList");
            list.innerHTML = ""; // clear "Loading..."

            nodes.forEach((node, index) => {
                const li = document.createElement("li");
                li.textContent = `${node.name} (${node.coordinates[0]}, ${node.coordinates[1]})`;
                list.appendChild(li);
            });

        } catch (error) {
            console.error(error);
            document.getElementById("nodesList").innerHTML =
                "<li>Error loading nodes</li>";
        }
    }

    // Load nodes when page opens
    loadNodes();
</script>

</body>
</html>
